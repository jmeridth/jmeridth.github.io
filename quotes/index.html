  &mdash; Robin Williams

  Be the change that you wish to see in the world.
  &mdash; Mahatma Gandhi



  If you tell the truth, you don&rsquo;t have to remember anything.
  &mdash; Mark Twain

  &mdash; Oscar Wilde

  &mdash; Narcotics Anonymous
